services:
  - type: web
    name: ai-receptionist-backend
    env: docker
    plan: starter
    envVars:
      - key: PORT
        value: "8000"
      - key: INSIGHTFACE_MODEL_NAME
        value: "buffalo_l"
      - key: INSIGHTFACE_PROVIDERS
        value: "CPUExecutionProvider"
      - key: FACE_EMBEDDING_DIMENSION
        value: "512"
      - key: MAX_IMAGE_SIZE_BYTES
        value: "5242880"
      - key: ALLOWED_IMAGE_TYPES
        value: "image/jpeg,image/png"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SERVER_PUBLIC_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
